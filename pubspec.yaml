name: sliver_prefetch
description: >-
  Know which list and grid items are about to scroll into view, and preload
  their data, images or video before the user gets there. Works with any
  SliverList or SliverGrid.
version: 0.1.4
repository: https://github.com/alsterverse/sliver_prefetch
issue_tracker: https://github.com/alsterverse/sliver_prefetch/issues

environment:
  sdk: ^3.3.0
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: '>=3.0.0 <7.0.0'
  flutter_test:
    sdk: flutter

topics:
  - scrolling
  - pagination
  - prefetch
  - infinite-scroll
  - lazy-loading

screenshots:
  - description: >-
      A slow-loading grid scrolled side by side: with sliver_prefetch, tiles
      are loaded before they scroll in; loading only what is on screen leaves
      placeholders.
    path: doc/demo.webp
